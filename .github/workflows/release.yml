name: Release & Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release Packages & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Build & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest -v tests/

      - name: Build Python Wheels and Sdist
        run: |
          python -m build

      - name: Package Release Archives (Web Arena & Models)
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            VERSION="v${{ github.event.inputs.version || '1.0.0' }}"
          fi
          python scripts/package_release.py "$VERSION"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Chess-AI ${{ github.ref_name || format('v{0}', github.event.inputs.version) }} — Web Arena & Neural Engine"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
