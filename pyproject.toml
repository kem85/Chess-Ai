[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-ai-arena"
version = "1.0.0"
description = "Deep Residual Neural Network Chess Engine & Interactive Web Arena powered by ONNX Runtime INT8 & MCTS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "kem85" }
]
keywords = [
    "chess",
    "chess-ai",
    "alphazero",
    "onnx",
    "onnxruntime",
    "pytorch",
    "neural-network",
    "mcts",
    "minimax",
    "web-arena"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "chess>=1.9.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "tqdm>=4.65.0",
    "joblib>=1.2.0",
    "Pillow>=9.5.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "streamlit>=1.25.0"
]

[project.scripts]
chess-ai = "app:main"
chess-web = "app:main"
chess-cli = "play:main"
chess-benchmark = "benchmark:main"

[project.urls]
Homepage = "https://github.com/kem85/Chess-Ai"
Repository = "https://github.com/kem85/Chess-Ai.git"
"Live Demo" = "https://chess-ai-ml.streamlit.app"

[tool.setuptools]
py-modules = ["app", "play", "benchmark"]
packages = ["src"]

[tool.setuptools.package-data]
"*" = ["web/*", "models/*.onnx"]
